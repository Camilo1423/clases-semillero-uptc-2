<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css" />
    <title>UPTC</title>
  </head>
  <body>
    <div class="container-chat" id="container-chat">
      <div class="container-image">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJH2cJYX8xetqZqnu2PZx_odKLjIrT4lWUUTHkyFozXC7ycW1XWjTL-JE&s=10"
          alt=""
        />
      </div>
      <div class="container-chat-info">
        <div class="container-user-info">
          <h2 class="container-chat">Juan Quijano</h2>
          <p>7:00 PM</p>
        </div>
        <div class="container-message">
          <p>Hola, ¿como estas?</p>
        </div>
      </div>
    </div>
    <div>
      <label for="count-items">Cantidad de personajes</label>
      <input
        type="text"
        id="count-items"
        placeholder="cantidad de personajes"
      />
    </div>
    <div>
      <label for="name-search">Nombre a buscar</label>
      <input
        type="text"
        id="name-search"
        placeholder="cantidad de personajes"
      />
      <button id="search-button">Buscar</button>
    </div>
    <div id="impresora"></div>
    <script src="onepiece.js"></script>
  </body>
</html>
